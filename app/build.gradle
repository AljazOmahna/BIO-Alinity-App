plugins {
    id 'com.android.application'
}

android {
    namespace 'si.kclj.bioalinity'
    compileSdk 34

    defaultConfig {
        applicationId "si.kclj.bioalinity"
        minSdk 26
        targetSdk 34
        // Build se samodejno oštevilči v CI (GitHub Actions): run number + kratki SHA.
        // Lokalno (brez CI) ostane 1 / 1.0.0-local.
        def runNum = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()
        def sha = (System.getenv("GITHUB_SHA") ?: "local")
        def shortSha = sha.length() >= 7 ? sha.substring(0, 7) : sha
        versionCode runNum
        versionName "1.0." + runNum + " (" + shortSha + ")"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/LICENSE.md', 'META-INF/LICENSE-notice.md',
                         'META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/NOTICE']
        }
    }

    signingConfigs {
        debug {
            storeFile file('../keystore/kclj_debug.jks')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            debuggable true
        }
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    // OneDrive / Microsoft Graph sinhronizacija
    implementation 'com.microsoft.identity.client:msal:5.+'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
