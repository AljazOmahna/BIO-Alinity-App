name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Generate keystore if missing
        run: |
          if [ ! -f keystore/kclj_debug.jks ]; then
            mkdir -p keystore
            keytool -genkeypair -v \
              -keystore keystore/kclj_debug.jks \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 36500 \
              -storepass android -keypass android \
              -dname "CN=KCLJ, OU=BIO, O=UKCL, L=Ljubljana, S=SI, C=SI"
            echo "Keystore generated."
          else
            echo "Keystore already exists."
          fi

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: bio-alinity-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # ADB install — uncomment and set DEVICE_SERIAL secret when tablet is connected:
      # - name: Install on tablet
      #   run: |
      #     adb -s ${{ secrets.DEVICE_SERIAL }} install -r \
      #       app/build/outputs/apk/debug/app-debug.apk
